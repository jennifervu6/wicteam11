<body>
    <div id="header">
        <button class="btn" id="map_btn" data-action="map_btn" onclick="showMapView()">Map View</button>
        <button class="btn" id="quiz-btn" data-action="quiz" onclick="showQuizView()">Quiz View</button>
        <button class="btn" id="playlist-btn" data-action="playlist" onclick="showPlaylistView()">Playlist View</button>
    </div>
    
    <div id="playlist-container">
        <h1>My Playlist</h1>
        <div id="playlist-content">
            <div class="empty-playlist">
                <p>Your playlist is empty!</p>
                <p>Go to the map and like some songs to build your playlist.</p>
            </div>
        </div>
    </div>
    
    <script src = "playlistScript.js"></script>
